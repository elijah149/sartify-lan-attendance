<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sartify Attendance</title>
<link rel="icon" type="image/png" href="/static/mark.png">
<style>
@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url('/static/fonts/inter-400.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url('/static/fonts/inter-600.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-style:normal;font-display:swap;src:url('/static/fonts/inter-700.woff2') format('woff2')}
:root{--black:#000000;--ink:#303030;--white:#FFFFFF;--blue:#4285F4;--blue-soft:#E8F0FE;--bg:#F4F5F7;--line:#E4E6EA;--muted:#6B6B6B;--pad:clamp(16px,4vw,32px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg);overflow-x:hidden}
img{max-width:100%}
h1,h2,h3{color:var(--black);margin:0;letter-spacing:-.02em}
h1{font-size:clamp(1.4rem,4.5vw,1.75rem);font-weight:700;line-height:1.2}
h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0}
a{color:var(--blue);text-decoration:none}

/* navigation */
.nav{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;padding:0 max(var(--pad),env(safe-area-inset-right)) 0 max(var(--pad),env(safe-area-inset-left));min-height:64px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center}
.logo{height:34px;width:auto;display:block}
.links{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{color:var(--ink);font-weight:600;padding:8px 12px;border-radius:8px;white-space:nowrap}
.links a:hover{background:var(--bg)}
.links a.on{color:var(--blue);background:var(--blue-soft)}

/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,32px) max(var(--pad),env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,24px);margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.narrow{max-width:440px;margin:24px auto}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat .n{font-size:clamp(1.9rem,6vw,2.4rem);font-weight:700;color:var(--black);letter-spacing:-.03em;line-height:1.1}
.stat .l{color:var(--muted);margin-top:4px}
.stat.dark{background:var(--black);border-color:var(--black)}
.stat.dark .n{color:var(--white)}
.stat.dark .l{color:#C9C9C9}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;color:var(--black);margin-bottom:6px;font-size:.9rem}
input{width:100%;min-width:0;padding:11px 12px;border:1px solid #CFD3D9;border-radius:10px;font:inherit;font-size:16px;color:var(--black);background:var(--white)}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form-grid .field{margin:0}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline-form input{width:auto;flex:1 1 150px}

/* show / hide password */
.pw{position:relative}
.pw input{padding-right:72px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:32px;padding:4px 10px;border:0;border-radius:8px;background:transparent;color:var(--blue);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.pw-toggle:hover{background:var(--blue-soft)}
.pw-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
@media(pointer:coarse){.pw-toggle{min-height:40px;padding:6px 12px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);color:var(--white);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(.93)}
.btn:focus-visible{outline:3px solid var(--blue-soft);outline-offset:1px}
.btn-dark{background:var(--black);border-color:var(--black)}
.btn-outline{background:var(--white);color:var(--ink);border-color:#CFD3D9}
.btn-outline:hover{border-color:var(--ink);filter:none}
.btn-sm{padding:7px 12px;font-size:.88rem;border-radius:8px}
.btn-block{width:100%}
.btn-lg{padding:16px 20px;font-size:1.05rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions form{margin:0}
.actions.end{justify-content:flex-end}
@media(pointer:coarse){.btn{min-height:44px}.btn-sm{min-height:40px}}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.82rem;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFAFB}
td.name{color:var(--black);font-weight:600}
td.empty{color:var(--muted);padding:24px 12px;text-align:center;white-space:normal}

/* small elements */
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--bg);color:var(--ink)}
.pill.blue{background:var(--blue);color:var(--white)}
.pill.black{background:var(--black);color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--black);font-weight:600}
.chip small{color:var(--muted);font-weight:400;margin-left:6px}
.notice{background:var(--blue-soft);border-left:4px solid var(--blue);color:var(--black);padding:12px 16px;border-radius:10px;margin-bottom:20px}
.error{background:var(--white);border:1px solid var(--black);border-left:4px solid var(--black);color:var(--black);padding:12px 16px;border-radius:10px;margin-bottom:16px}

/* user punch card */
.punch{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,40px);align-items:center}
.clock-big{font-size:clamp(2.8rem,9vw,4.2rem);font-weight:700;color:var(--black);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.time-box{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.time-box .l{color:var(--muted);font-size:.85rem}
.time-box .v{font-size:clamp(1.2rem,4.5vw,1.5rem);font-weight:700;color:var(--black);font-variant-numeric:tabular-nums}

/* login */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;min-height:100dvh}
.auth-art{background:var(--black);color:var(--white);padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-art .kicker{font-weight:600;color:#C9C9C9;font-size:1.05rem}
.auth-art .clock{font-size:clamp(3.2rem,9vw,7.5rem);font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.auth-art .date{color:#C9C9C9;font-size:1.1rem;margin-top:12px}
.minute{height:4px;background:var(--ink);border-radius:2px;margin-top:28px;max-width:320px;overflow:hidden}
.minute i{display:block;height:100%;width:0;background:var(--blue)}
.auth-art p{color:#C9C9C9;max-width:380px;margin:0}
.auth-form{background:var(--white);display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,5vw,56px)}
.auth-card{max-width:380px;width:100%;margin:0 auto}
.logo-lg{height:54px;width:auto;display:block;margin-bottom:44px}
.auth-card h1{margin-bottom:6px}
.auth-card .sub{margin:0 0 24px}

/* tablet */
@media(max-width:900px){
  .punch{grid-template-columns:1fr}
}

/* login on small screens: compact black header above the form */
@media(max-width:860px){
  .auth{grid-template-columns:1fr;min-height:0}
  .auth-art{gap:16px;padding:24px 20px}
  .auth-art p{display:none}
  .auth-art .clock{font-size:3.2rem}
  .auth-art .date{font-size:1rem;margin-top:6px}
  .minute{margin-top:16px}
  .auth-form{padding:32px 20px 48px}
  .logo-lg{height:44px;margin-bottom:28px}
}

/* phone */
@media(max-width:760px){
  .nav{position:static}
  .nav-in{flex-wrap:wrap;gap:8px 12px;min-height:0;padding-top:10px;padding-bottom:4px}
  .brand{flex:1}
  .nav-in > .btn{order:2}
  .links{order:3;flex:0 0 100%;padding-bottom:8px}
  .links a{padding:9px 12px;background:var(--bg)}
  .links a.on{background:var(--blue-soft)}
  .logo{height:28px}
  .page-head{align-items:stretch}
  .page-head .inline-form{width:100%}
  .btn-block,.page-head .btn{min-height:44px}

  /* tables become stacked cards */
  .table-wrap{overflow:visible}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:12px}
  table.stack tbody tr:hover td{background:transparent}
  table.stack td{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);white-space:normal;text-align:right}
  table.stack td:last-child{border-bottom:0}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-weight:600;font-size:.82rem;text-align:left;flex:0 0 auto}
  table.stack td.actions-cell{display:block}
  table.stack td.actions-cell::before{display:none}
  table.stack td.empty{display:block;text-align:center}
  table.stack td.empty::before{display:none}
  .actions.end{justify-content:flex-start}
}
@media(max-width:380px){
  .times{grid-template-columns:1fr}
}
</style></head>
<body>
{% block shell %}
{% set p = request.url.path %}
<header class="nav"><div class="nav-in">
  <a class="brand" href="/"><img class="logo" src="/static/logo.png" alt="Sartify"></a>
  <nav class="links">
  {% if p.startswith('/admin') %}
    <a href="/admin" class="{{ 'on' if p == '/admin' else '' }}">Attendance</a>
    <a href="/admin/report" class="{{ 'on' if p.startswith('/admin/report') else '' }}">Monthly report</a>
  {% endif %}
  </nav>
  <a class="btn btn-outline btn-sm" href="/logout">Log out</a>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
{% endblock %}
<script>
/* Adds a Show / Hide button to every password field on the page */
(function(){
  var fields = document.querySelectorAll('input[type="password"]');
  for (var i = 0; i < fields.length; i++) {
    (function(inp){
      var wrap = document.createElement('div');
      wrap.className = 'pw';
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pw-toggle';
      b.textContent = 'Show';
      b.setAttribute('aria-label', 'Show password');
      b.addEventListener('click', function(){
        var reveal = inp.type === 'password';
        inp.type = reveal ? 'text' : 'password';
        b.textContent = reveal ? 'Hide' : 'Show';
        b.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
        if (!window.matchMedia('(pointer:coarse)').matches) { inp.focus(); }
      });
      wrap.appendChild(b);
    })(fields[i]);
  }
})();
</script>
</body></html>
