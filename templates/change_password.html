{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1 style="font-size:1.5rem">Set a new password</h1>
  <p class="sub" style="margin-bottom:20px">Choose a password you have not used before. It must be at least 8 characters.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/change-password">
    <div class="field"><label for="pw">New password</label>
    <input id="pw" type="password" name="password" required autocomplete="new-password"></div>
    <div class="field"><label for="cf">Confirm password</label>
    <input id="cf" type="password" name="confirm" required autocomplete="new-password"></div>
    <button class="btn btn-block" style="margin-top:8px">Save password</button>
  </form>
</div>
{% endblock %}
